version: 2.1

orbs:
  aws-cli: circleci/aws-cli@3.1.4
  gcp-cli: circleci/gcp-cli@3.1.1

parameters:
  run-mitigation-test:
    type: boolean
    default: false
  instance-name:
    type: string
    default: redmica2-south-carolina
  zone:
    type: string
    default: us-east1-d
  pip-executable:
    type: string
    default: /usr/bin/pip3
  pip-package:
    type: string
    default: python3-pip

jobs:
  build:
    docker:
      - image: ghcr.io/docker-images-mamono210/circleci-executors/ansible:latest
    environment:
      CVE_PROJECT: buoyant-world-263612
      CVE_INSTANCE: << pipeline.parameters.instance-name >>
      CVE_ZONE: << pipeline.parameters.zone >>
      CVE_PIP_EXECUTABLE: << pipeline.parameters.pip-executable >>
      CVE_PIP_PACKAGE: << pipeline.parameters.pip-package >>
      CVE_S3_PREFIX: circleci-gce/redmine/issue5505-test/20261104-R01

    steps:
      - checkout
      - run:
          name: Check trial parameters
          command: |
            set -euo pipefail
            test "$CVE_INSTANCE" = redmica2-south-carolina
            test "$CVE_ZONE" = us-east1-d
            test "$CVE_PIP_EXECUTABLE" = /usr/bin/pip3
            test "$CVE_PIP_PACKAGE" = python3-pip

      - aws-cli/setup:
          profile-name: default
          role-arn: ${AWS_ROLE_ARN}
          role-session-name: CircleCI_circleci-gce_redmine-stop
          session-duration: "3600"

      - run:
          name: Verify AWS role for backup
          command: |
            set -euo pipefail
            cve_expected_role="arn:aws:iam::808683561341:role/CircleCI_OIDC_circleci-gce"
            if [ "${AWS_ROLE_ARN:-}" != "$cve_expected_role" ]; then
              echo "STOP: AWS_ROLE_ARN does not match the checked role."
              exit 1
            fi
            cve_caller_arn="$(aws sts get-caller-identity --query Arn --output text --no-cli-pager)"
            case "$cve_caller_arn" in
              arn:aws:sts::808683561341:assumed-role/CircleCI_OIDC_circleci-gce/*)
                echo AWS_ROLE_CHECK=PASS
                ;;
              *)
                echo "STOP: Active AWS identity does not match the checked role."
                exit 1
                ;;
            esac

      - gcp-cli/setup

      - run:
          name: Verify target instance
          command: |
            set -euo pipefail
            cve_instance_id="$(gcloud compute instances describe "$CVE_INSTANCE" \
              --project="$CVE_PROJECT" --zone="$CVE_ZONE" --format='value(id)')"
            test "$cve_instance_id" = 7213092591087619377
            printf 'TARGET_INSTANCE_ID=%s\n' "$cve_instance_id"

      - run:
          name: Show Ansible version
          command: |
            ansible --version
            ansible-community --version

      - run:
          name: Create SSH Key
          command: |
            set -euo pipefail
            gcloud compute ssh "centos@$CVE_INSTANCE" \
              --project="$CVE_PROJECT" \
              --command "cat /etc/redhat-release" \
              --zone="$CVE_ZONE" --quiet

      - run:
          name: Prepare connection info (ip_addr) once
          command: |
            set -euo pipefail
            mkdir -p ~/.ssh
            echo "StrictHostKeyChecking no" > ~/.ssh/config
            ip_addr="$(gcloud compute instances describe "$CVE_INSTANCE" \
              --project="$CVE_PROJECT" --zone="$CVE_ZONE" \
              --format='get(networkInterfaces[0].accessConfigs[0].natIP)')"
            test -n "$ip_addr"
            printf '%s\n' "$ip_addr" > /tmp/ip_addr

      - run:
          name: Verify mitigation before backup
          command: |
            set -euo pipefail
            ip_addr="$(cat /tmp/ip_addr)"
            test -n "$ip_addr"
            ssh -o BatchMode=yes -o ConnectTimeout=10 \
              -i "$HOME/.ssh/google_compute_engine" "centos@$ip_addr" '
              set -eu
              test "$(hostname -s)" = redmica2-south-carolina
              sudo -n systemctl is-active --quiet cve-2026-98432-mitigation.service
              cve_start="$(sudo -n systemctl show cve-2026-98432-mitigation.service -p ExecMainStartTimestampMonotonic --value)"
              case "$cve_start" in ""|0|*[!0-9]*) exit 1 ;; esac
              test -r /proc/sys/kernel/random/boot_id
              cat /proc/sys/kernel/random/boot_id
              printf "SERVICE_START=%s\n" "$cve_start"
              sudo -n nft --stateless list table inet cve_2026_98432
            ' > /tmp/issue5505-before
            test -s /tmp/issue5505-before
            cat /tmp/issue5505-before
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            echo MITIGATION_BEFORE_BACKUP_PASS

      - run:
          name: Create Redmine backup data
          command: |
            set -euo pipefail
            ip_addr="$(cat /tmp/ip_addr)"
            git clone https://github.com/ansible-playbooks-mamono210/redmine_create-backup.git
            cd redmine_create-backup
            git rev-parse HEAD
            ansible-galaxy install -r roles/requirements.yml
            ansible-playbook -i "${ip_addr}," \
              -u centos --key-file="$HOME/.ssh/google_compute_engine" \
              create-backup.yml
          no_output_timeout: 30m

      - run:
          name: Prepare S3 upload playbook (once)
          command: |
            set -euo pipefail
            git clone https://github.com/ansible-playbooks-mamono210/aws-s3.git
            cd aws-s3
            git rev-parse HEAD
            ansible-galaxy install -r roles/requirements.yml

      - run:
          name: Upload archived media file to S3
          command: |
            set -euo pipefail
            ip_addr="$(cat /tmp/ip_addr)"
            cd aws-s3
            ansible-playbook -i "${ip_addr}," \
              -u centos --key-file="$HOME/.ssh/google_compute_engine" \
              -e "pip_executable=$CVE_PIP_EXECUTABLE" \
              -e "pip_package=$CVE_PIP_PACKAGE" \
              -e "s3_bucket=mamono210" \
              -e "s3_object_name=$CVE_S3_PREFIX/files.tar.gz" \
              -e "upload_file_path=/tmp/redmine-backup/files.tar.gz" \
              put.yml
          no_output_timeout: 30m

      - run:
          name: Upload archived git file to S3
          command: |
            set -euo pipefail
            ip_addr="$(cat /tmp/ip_addr)"
            cd aws-s3
            ansible-playbook -i "${ip_addr}," \
              -u centos --key-file="$HOME/.ssh/google_compute_engine" \
              -e "pip_executable=$CVE_PIP_EXECUTABLE" \
              -e "pip_package=$CVE_PIP_PACKAGE" \
              -e "s3_bucket=mamono210" \
              -e "s3_object_name=$CVE_S3_PREFIX/git.tar.gz" \
              -e "skip_bootstrap=true" \
              -e "upload_file_path=/tmp/redmine-backup/git.tar.gz" \
              put.yml
          no_output_timeout: 30m

      - run:
          name: Upload archived PostgreSQL dump to S3
          command: |
            set -euo pipefail
            ip_addr="$(cat /tmp/ip_addr)"
            cd aws-s3
            ansible-playbook -i "${ip_addr}," \
              -u centos --key-file="$HOME/.ssh/google_compute_engine" \
              -e "pip_executable=$CVE_PIP_EXECUTABLE" \
              -e "pip_package=$CVE_PIP_PACKAGE" \
              -e "s3_bucket=mamono210" \
              -e "s3_object_name=$CVE_S3_PREFIX/redmine.sql" \
              -e "skip_bootstrap=true" \
              -e "upload_file_path=/tmp/redmine-backup/redmine.sql" \
              put.yml
          no_output_timeout: 30m

      - run:
          name: Verify mitigation after upload
          command: |
            set -euo pipefail
            ip_addr="$(cat /tmp/ip_addr)"
            test -n "$ip_addr"
            ssh -o BatchMode=yes -o ConnectTimeout=10 \
              -i "$HOME/.ssh/google_compute_engine" "centos@$ip_addr" '
              set -eu
              test "$(hostname -s)" = redmica2-south-carolina
              sudo -n systemctl is-active --quiet cve-2026-98432-mitigation.service
              cve_start="$(sudo -n systemctl show cve-2026-98432-mitigation.service -p ExecMainStartTimestampMonotonic --value)"
              case "$cve_start" in ""|0|*[!0-9]*) exit 1 ;; esac
              test -r /proc/sys/kernel/random/boot_id
              cat /proc/sys/kernel/random/boot_id
              printf "SERVICE_START=%s\n" "$cve_start"
              sudo -n nft --stateless list table inet cve_2026_98432
            ' > /tmp/issue5505-after
            test -s /tmp/issue5505-after
            cmp /tmp/issue5505-before /tmp/issue5505-after
            cat /tmp/issue5505-after
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            echo MITIGATION_AFTER_UPLOAD_PASS

workflows:
  mitigation-backup-test:
    when: << pipeline.parameters.run-mitigation-test >>
    jobs:
      - build:
          context:
            - AWS_OPENID_CONNECT_TOKENS
            - GOOGLE_CLOUD_IAM
          filters:
            branches:
              only: test/issue5505-backup-r01
