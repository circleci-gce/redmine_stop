version: 2.1

orbs:
  aws-cli: circleci/aws-cli@3.1.4
  gcp-cli: circleci/gcp-cli@3.1.1

parameters:
  instance-name:
    type: string
    default: ""
  zone:
    type: string
    default: ""
  # Keep the previous API shape. Production uses installed packages only.
  pip-executable:
    type: string
    default: ""
  pip-package:
    type: string
    default: ""

jobs:
  check-code:
    docker:
      - image: ghcr.io/docker-images-mamono210/circleci-executors/ansible:latest
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - checkout
      - run:
          name: Run offline backup and stop safety tests
          command: |
            set -euo pipefail
            python3 -m unittest discover -s .circleci/tests -p 'test_*.py'

  build:
    docker:
      - image: ghcr.io/docker-images-mamono210/circleci-executors/ansible:latest
    environment:
      CVE_PROJECT: buoyant-world-263612
      CVE_ZONE: us-east1-d
      REDMINE_INSTANCE: << pipeline.parameters.instance-name >>
      REDMINE_ZONE: << pipeline.parameters.zone >>
      PYTHONDONTWRITEBYTECODE: "1"
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - checkout
      - run:
          name: Verify production branch and target parameters
          command: python3 .circleci/redmine_stop.py --check
      - aws-cli/setup:
          profile-name: default
          role-arn: ${AWS_ROLE_ARN}
          role-session-name: CircleCI_circleci-gce_redmine-stop
          session-duration: "3600"
      - gcp-cli/setup:
          google_project_id: CVE_PROJECT
          google_compute_zone: CVE_ZONE
      - run:
          name: Back up through IAP, verify S3 and cleanup, then stop the VM
          no_output_timeout: 10m
          command: python3 .circleci/redmine_stop.py --run

workflows:
  stop-redmine:
    jobs:
      - check-code
      - build:
          requires:
            - check-code
          serial-group: buoyant-world-263612/us-east1-d/redmica2-south-carolina/backup-stop
          context:
            - AWS_OPENID_CONNECT_TOKENS
            - GOOGLE_CLOUD_IAM
          filters:
            branches:
              only: main
