version: 2.1
orbs:
  gcp-cli: circleci/gcp-cli@1.8.4

parameters:
  instance-name:
    type: string
    default: ""
  pip-executable:
    type: string
    default: ""
  pip-package:
    type: string
    default: ""
  s3-bucket-name:
    type: string
    default: ""
  s3-object-name:
    type: string
    default: ""
  zone:
    type: string
    default: ""

jobs:
  build:
    docker:
      - image: cimg/gcp:2022.11.1

    steps:
      - checkout
      - gcp-cli/initialize
      - run:
          name: Upgrade Ansible
          command: |
            pip install --upgrade ansible
      - run:
          name: Show Ansible version
          command: |
            ansible --version
            ansible-community --version
      - run:
          name: Create SSH Key
          command: |
            gcloud compute ssh centos@<< pipeline.parameters.instance-name >> \
            --command "cat /etc/redhat-release" \
            --zone=<< pipeline.parameters.zone >> \
            --quiet
      - run:
          name: Create Redmine backup data
          command: |
            # Retrieve Ansible playbook
            git clone https://github.com/ansible-playbooks-centos7/redmine_create-backup.git

            # Set Strict host key checking no
            echo "StrictHostKeyChecking no" > ~/.ssh/config

            # Get external Ip addr
            ip_addr=$(
                       gcloud compute instances describe << pipeline.parameters.instance-name >> \
                       --format='get(networkInterfaces[0].accessConfigs[0].natIP)' \
                       --zone=<< pipeline.parameters.zone >> \
                     )

            # Execute Ansible ad-hoc
            cd redmine_create-backup
            ansible-playbook -i ${ip_addr}, \
            -u centos \
            --key-file="~/.ssh/google_compute_engine" \
            create-backup.yml
      - run:
          name: Put backup data to S3
          command: |
            # Retrieve Ansible playbook
            git clone https://github.com/ansible-playbooks-centos7/aws-s3.git

            # Set Strict host key checking no
            echo "StrictHostKeyChecking no" > ~/.ssh/config

            # Get external Ip addr
            ip_addr=$(
                       gcloud compute instances describe << pipeline.parameters.instance-name >> \
                       --format='get(networkInterfaces[0].accessConfigs[0].natIP)' \
                       --zone=<< pipeline.parameters.zone >> \
                     )

            # Execute Ansible Playbook
            cd aws-s3
            ansible-galaxy install -r roles/requirements.yml

            ansible-playbook -i ${ip_addr}, \
            -u centos \
            --key-file="~/.ssh/google_compute_engine" \
            -e "aws_access_key_id=${AWS_ACCESS_KEY_ID}" \
            -e "aws_secret_access_key=${AWS_SECRET_ACCESS_KEY}" \
            -e "aws_region=${AWS_REGION}" \
            -e "pip_executable=<< pipeline.parameters.pip-executable >>" \
            -e "pip_package=<< pipeline.parameters.pip-package >>" \
            -e "s3_bucket=<< pipeline.parameters.s3-bucket-name >>" \
            -e "s3_object_name=<< pipeline.parameters.s3-object-name >>" \
            -e "upload_file_path=${UPLOAD_FILE_PATH}" \
            put.yml
      - run:
          name: Stop instance
          command: |
            gcloud compute instances stop << pipeline.parameters.instance-name >> \
            --zone=<< pipeline.parameters.zone >>
      - run:
          name: Install Tweepy
          command: |
            export PIP=$(which pip pip3 | head -1)
            $PIP install tweepy --upgrade
      - run:
          name: Send notifcation
          command: |
            export PYTHON=$(which python python3 | tail -1)
            $PYTHON tweet.py \
            ${TWITTER_CONSUMER_KEY} \
            ${TWITTER_CONSUMER_SECRET_KEY} \
            ${TWITTER_ACCESS_TOKEN} \
            ${TWITTER_ACCESS_TOKEN_SECRET} \
            ${TWITTER_RECIPIENT} \

workflows:
  version: 2
  stop-redmine:
    jobs:
      - build:
          context: GCP
